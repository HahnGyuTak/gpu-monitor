name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      matrix:
        os: [macos-14, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test collectors and state transitions
        run: bash test.sh
      - name: Build app
        env:
          CODESIGN_IDENTITY: "-"
        run: bash build.sh
      - name: Verify signature
        run: codesign --verify --deep --strict "dist/GPU Monitor.app"
